<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trích Xuất Bill Ngân Hàng</title>
    <meta name="description" content="Ứng dụng trích xuất tự động thông tin người nhận, số tài khoản nhận và ngân hàng nhận từ ảnh bill chuyển khoản ngân hàng bằng Google Gemini AI." />
    <meta property="og:title" content="Trích Xuất Bill Ngân Hàng" />
    <meta property="og:description" content="Ứng dụng trích xuất tự động thông tin người nhận, số tài khoản nhận và ngân hàng nhận từ ảnh bill chuyển khoản ngân hàng bằng Google Gemini AI." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function() {
        // 1. Ngăn chặn lỗi uncaught khi extension hoặc script ngoài cố gắng gán window.fetch
        window.addEventListener('error', function(event) {
          if (event && event.message && event.message.includes('fetch of #<Window>')) {
            if (event.preventDefault) event.preventDefault();
            return true;
          }
        }, true);

        // 2. Cung cấp setter cho window.fetch để các tiện ích mở rộng có thể gán mà không bị lỗi read-only getter
        try {
          var _nativeFetch = window.fetch ? window.fetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            get: function() { return _nativeFetch; },
            set: function(newFn) { _nativeFetch = newFn; },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            Object.defineProperty(window, 'fetch', {
              value: window.fetch,
              writable: true,
              configurable: true,
              enumerable: true
            });
          } catch (e2) {}
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
